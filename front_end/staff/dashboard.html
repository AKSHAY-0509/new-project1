<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="../students/styles.css" />
  </head>
  <body data-page="staff-dashboard">
    <div class="container dashboard-container">
      <div class="dashboard-layout">
        <div class="summary-panel" style="grid-column: 1 / -1;">
          <h3>Staff Dashboard</h3>
          <div class="student-meta">
            <p><strong>Name:</strong> <span id="staffName">-</span></p>
            <p><strong>Email:</strong> <span id="staffEmail">-</span></p>
          </div>
          <p class="switch-link">
            <a href="update-profile.html">Update Profile</a>
          </p>
        </div>
      </div>

      <div class="od-panel" style="margin-top: 20px;">
        <h3>Student OD Requests</h3>
        <div id="staffOdRequests" class="od-list"></div>
      </div>

      <div class="summary-panel" style="margin-top: 20px;">
        <h3>Create Event</h3>
        <form id="createEventForm">
          <div class="input-group">
            <label for="eventName">Event Name</label>
            <input id="eventName" type="text" placeholder="Tech Fest 2026" required />
          </div>

          <div class="grid-two">
            <div class="input-group">
              <label for="eventClub">Club</label>
              <select id="eventClub" required>
                <option value="Sports Club">Sports Club</option>
                <option value="Dance Club">Dance Club</option>
                <option value="Music Club">Music Club</option>
                <option value="Coding Club">Coding Club</option>
              </select>
            </div>
            <div class="input-group">
              <label for="eventDate">Date</label>
              <input id="eventDate" type="date" required />
            </div>
          </div>

          <div class="input-group">
            <label for="eventTime">Time</label>
            <input id="eventTime" type="time" required />
          </div>

          <div class="input-group">
            <label for="eventDescription">Description</label>
            <textarea id="eventDescription" rows="3" placeholder="Event details" required></textarea>
          </div>

          <button type="submit" class="btn-primary">Create Event</button>
        </form>
      </div>

      <div class="od-panel" style="margin-top: 20px;">
        <h3>Created Events</h3>
        <div id="staffCreatedEvents" class="od-list"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
