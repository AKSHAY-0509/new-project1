<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Login</title>
    <link rel="stylesheet" href="../students/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-box">
        <h1>Staff Login</h1>
        <p>Access staff panel</p>

        <form id="staffLoginForm">
          <div class="input-group">
            <label for="staffLoginEmail">Email</label>
            <input type="email" id="staffLoginEmail" required />
          </div>

          <div class="input-group">
            <label for="staffLoginPassword">Password</label>
            <input type="password" id="staffLoginPassword" required />
          </div>

          <button type="submit" class="btn-primary">Login</button>
        </form>

        <p class="switch-link">
          New staff member?
          <a href="signup.html">Create account</a>
        </p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
