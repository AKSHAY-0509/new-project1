<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vignan Campus Portal</title>
    <style>
      * { box-sizing: border-box; font-family: Arial, sans-serif; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #edf3ff, #dfe9ff);
      }
      .card {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(20, 30, 60, 0.15);
        padding: 40px 32px;
        text-align: center;
        max-width: 700px;
        width: 90%;
      }
      h1 {
        color: #1d3557;
        margin-bottom: 16px;
      }
      p {
        color: #53657e;
        margin-bottom: 24px;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .btn {
        text-decoration: none;
        background: linear-gradient(135deg, #4d79f1, #6a8eff);
        color: white;
        padding: 12px 22px;
        border-radius: 10px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Vignan Campus Portal</h1>
      <p>Choose the section you want to access.</p>

      <div class="actions">
        <a class="btn" href="students/signup.html">Student Sign Up</a>
        <a class="btn" href="students/login.html">Student Login</a>
        <a class="btn" href="students/dashboard.html">Student Dashboard</a>
        <a class="btn" href="staff/signup.html">Staff Sign Up</a>
        <a class="btn" href="staff/login.html">Admin Login</a>
      </div>
    </div>
  </body>
</html>
