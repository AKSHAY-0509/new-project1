<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vignan Campus Portal</title>
    <style>
      :root {
        --primary: #3a6ef0;
        --primary-dark: #204fd2;
        --secondary: #7c4dff;
        --bg-1: #eef4ff;
        --bg-2: #dfeaff;
        --text: #1d2a3a;
        --muted: #586a82;
        --card: rgba(255, 255, 255, 0.8);
        --border: rgba(94, 120, 185, 0.16);
        --shadow: 0 25px 60px rgba(27, 42, 81, 0.18);
      }

      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(122, 152, 255, 0.28), transparent 32%),
          radial-gradient(circle at bottom right, rgba(108, 92, 231, 0.18), transparent 30%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        padding: 24px;
        color: var(--text);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        filter: blur(40px);
        z-index: 0;
        opacity: 0.5;
      }

      body::before {
        background: rgba(58, 110, 240, 0.18);
        top: -80px;
        left: -100px;
      }

      body::after {
        background: rgba(124, 77, 255, 0.16);
        right: -80px;
        bottom: -70px;
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(860px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 42px 36px 32px;
        text-align: center;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(58, 110, 240, 0.12), rgba(124, 77, 255, 0.12));
        border: 1px solid rgba(58, 110, 240, 0.18);
        color: var(--primary-dark);
        padding: 8px 14px;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.05;
        letter-spacing: -0.05em;
        color: var(--text);
      }

      h1 .highlight {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        margin: 0 auto 28px;
        max-width: 620px;
        color: var(--muted);
        font-size: 1.04rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 180px;
        padding: 14px 20px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.98rem;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), #5b88ff);
        box-shadow: 0 14px 28px rgba(58, 110, 240, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      .btn:nth-child(2n) {
        background: linear-gradient(135deg, #1dbf8a, #3ac79d);
        box-shadow: 0 14px 28px rgba(29, 191, 138, 0.22);
      }

      .btn:nth-child(3n) {
        background: linear-gradient(135deg, #8a5cf6, #6f6cf8);
        box-shadow: 0 14px 28px rgba(122, 92, 246, 0.22);
      }

      .btn:nth-child(4n) {
        background: linear-gradient(135deg, #ff8c42, #ff5f6d);
        box-shadow: 0 14px 28px rgba(255, 110, 91, 0.22);
      }

      .btn:hover {
        transform: translateY(-3px) scale(1.01);
        filter: brightness(1.04);
      }

      .btn:active {
        transform: translateY(0);
      }

      @media (max-width: 640px) {
        .card {
          padding: 30px 18px 22px;
        }

        .btn {
          width: 100%;
          min-width: 0;
        }

        .actions {
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Campus Portal</div>
      <h1><span class="highlight">Vignan</span> Campus Portal</h1>
      <p>Choose the section you want to access and manage your academic journey with ease.</p>

      <div class="actions">
        <a class="btn" href="students/signup.html">Student Sign Up</a>
        <a class="btn" href="students/login.html">Student Login</a>
        <a class="btn" href="students/dashboard.html">Student Dashboard</a>
        <a class="btn" href="staff/signup.html">Staff Sign Up</a>
        <a class="btn" href="staff/login.html">Admin Login</a>
      </div>
    </div>
  </body>
</html>
